global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: visa-seva-api
    metrics_path: /internal/metrics
    static_configs:
      - targets: [api:9090]

  - job_name: visa-seva-postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
