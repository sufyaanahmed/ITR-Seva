name: visa-seva-showcase

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: visa_seva
      POSTGRES_USER: visa_seva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - max_connections=80
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=250
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visa_seva -d visa_seva"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://visa_seva:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/visa_seva
      API_ADDR: 0.0.0.0:3000
      INTERNAL_ADDR: 0.0.0.0:9090
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-32}
      DATABASE_MIN_CONNECTIONS: 4
      DATABASE_ACQUIRE_TIMEOUT_MS: 500
      MAX_IN_FLIGHT_REQUESTS: ${MAX_IN_FLIGHT_REQUESTS:-512}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-2000}
      SESSION_RATE_LIMIT_PER_SECOND: ${SESSION_RATE_LIMIT_PER_SECOND:-100}
      STATUS_RATE_LIMIT_PER_SECOND: ${STATUS_RATE_LIMIT_PER_SECOND:-30}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      RUN_MIGRATIONS: "true"
      RUST_LOG: visa_seva_api=info,tower_http=warn
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9090/internal/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 4

volumes:
  postgres-data:
