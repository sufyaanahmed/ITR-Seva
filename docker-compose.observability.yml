name: visa-seva-observability-demo

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SHOWCASE_BACKEND: enabled
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data:size=32m,noexec,nosuid,nodev
      - /config:size=4m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://visa_seva:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/visa_seva?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --storage.tsdb.retention.size=1GB
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/visa-seva-load-demo.json
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 0.75

  k6:
    image: grafana/k6:1.1.0
    profiles: ["load"]
    environment:
      API_URL: http://api:3000/api/v1
      RPS: ${RPS:-500}
      DURATION: ${DURATION:-2m}
      PRE_ALLOCATED_VUS: ${PRE_ALLOCATED_VUS:-300}
      MAX_VUS: ${MAX_VUS:-1000}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(90),p(95),p(99),max
      K6_PROMETHEUS_RW_STALE_MARKERS: "true"
    command:
      - run
      - --out
      - experimental-prometheus-rw
      - --tag
      - testid=${LOAD_TEST_ID:-visa-seva-demo}
      - /scripts/mixed-workload.js
    volumes:
      - ./load-tests:/scripts:ro
    depends_on:
      api:
        condition: service_healthy
      prometheus:
        condition: service_started
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 4

volumes:
  prometheus-data:
  grafana-data:
